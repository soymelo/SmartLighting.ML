[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartlighting-ml"
version = "0.1.0"
description = "Geracao, preparacao e avaliacao de dados para dimerizacao adaptativa da maquete SmartLighting"
requires-python = ">=3.11"
dependencies = ["scikit-learn==1.9.1"]

[project.scripts]
smartlighting-generate = "smartlighting_ml.generate:main"
smartlighting-prepare = "smartlighting_ml.prepare:main"
smartlighting-evaluate = "smartlighting_ml.evaluate:main"
smartlighting-train = "smartlighting_ml.train:main"
smartlighting-dimming-policy = "smartlighting_ml.dimming_policy:main"
smartlighting-evaluate-dimming = "smartlighting_ml.evaluate_dimming:main"
smartlighting-topology = "smartlighting_ml.topology:main"
smartlighting-zone-windows = "smartlighting_ml.zone_windows:main"
smartlighting-evaluate-luminaires = "smartlighting_ml.evaluate_luminaires:main"
smartlighting-zone-rest = "smartlighting_ml.zone_rest:main"
smartlighting-compare-models = "smartlighting_ml.compare_models:main"
smartlighting-export-firmware = "smartlighting_ml.export_firmware:main"

[tool.setuptools.packages.find]
where = ["src"]
