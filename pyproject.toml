[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartlighting-ml"
version = "0.1.0"
description = "Geracao, preparacao e avaliacao de dados para dimerizacao adaptativa da maquete SmartLighting"
requires-python = ">=3.11"
dependencies = ["scikit-learn==1.9.1"]

[project.scripts]
smartlighting-generate = "smartlighting_ml.generate:main"
smartlighting-prepare = "smartlighting_ml.prepare:main"
smartlighting-evaluate = "smartlighting_ml.evaluate:main"
smartlighting-train = "smartlighting_ml.train:main"
smartlighting-dimming-policy = "smartlighting_ml.dimming_policy:main"

[tool.setuptools.packages.find]
where = ["src"]
